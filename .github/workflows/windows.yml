name: MohammedLab PS5 Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Build, test, and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout recursive source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout locked vcpkg
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: microsoft/vcpkg
          ref: 9624c70bcc649d9ecff24185a72b12e0001de6f7
          path: _Build/vcpkg
          persist-credentials: false

      - name: Cache locked glslang installation
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: _Build/vcpkg/installed
          key: windows-${{ runner.arch }}-vcpkg-9624c70bcc649d9ecff24185a72b12e0001de6f7-glslang-16.1.0

      - name: Verify pinned source
        id: source
        shell: pwsh
        run: |
          $expected = 'b3e419ff1101999525fa2d061ada1d102cf788b1'
          $actual = git -C upstream/KytyPS5 rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) {
            throw "Unexpected KytyPS5 source commit: $actual"
          }
          git -C upstream/KytyPS5 submodule status --recursive

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      - name: Install glslang
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE '_Build/vcpkg'
          $expectedVcpkg = '9624c70bcc649d9ecff24185a72b12e0001de6f7'
          $actualVcpkg = git -C $vcpkgRoot rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actualVcpkg -ne $expectedVcpkg) {
            throw "Unexpected vcpkg revision: $actualVcpkg"
          }
          & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          & (Join-Path $vcpkgRoot 'vcpkg.exe') install 'glslang[tools,opt]:x64-windows'
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg glslang installation failed' }
          $glslangDir = Join-Path $vcpkgRoot 'installed\x64-windows\tools\glslang'
          if (-not (Test-Path (Join-Path $glslangDir 'glslangValidator.exe'))) {
            throw "glslangValidator missing from $glslangDir"
          }
          $glslangPackage = & (Join-Path $vcpkgRoot 'vcpkg.exe') list |
            Select-String '^glslang:x64-windows '
          if (-not $glslangPackage -or $glslangPackage.Line -notmatch '16\.1\.0') {
            throw "Unexpected installed glslang package: $glslangPackage"
          }
          $validatorVersion = & (Join-Path $glslangDir 'glslangValidator.exe') --version |
            Select-String 'Glslang Version:.*16\.1\.0'
          if ($LASTEXITCODE -ne 0 -or -not $validatorVersion) {
            throw 'glslangValidator is missing or is not version 16.1.0'
          }
          "VCPKG_COMMIT=$actualVcpkg" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GLSLANG_PACKAGE=$($glslangPackage.Line.Trim())" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GLSLANG_VALIDATOR_VERSION=$($validatorVersion.Line.Trim())" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $glslangDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Verify toolchain
        id: toolchain
        shell: pwsh
        run: |
          git --version
          cmake --version
          ninja --version
          clang-cl --version
          glslangValidator --version
          Write-Host "Qt6_DIR=$env:Qt6_DIR"

      - name: Apply tracked source patches
        id: patch
        shell: pwsh
        run: ./scripts/apply-upstream-patches.ps1

      - name: Configure patched pinned source
        id: configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path _Build/reports -Force | Out-Null
          cmake -S upstream/KytyPS5 -B _Build/windows -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON `
            -DBUILD_TESTING=ON `
            -DKYTY_BUILD_ORIGIN=Fork `
            -DKYTY_BUILD_REPOSITORY="${{ github.repository }}" `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" 2>&1 |
            Tee-Object -FilePath _Build/reports/configure.log
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }

      - name: Build launcher, emulator, and every registered test executable
        id: build
        shell: pwsh
        run: |
          cmake --build _Build/windows --target launcher kyty_emulator `
            kyty_tests --parallel 2>&1 |
            Tee-Object -FilePath _Build/reports/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }

      - name: Run all registered CTest regressions
        id: ctest
        shell: pwsh
        run: |
          ctest --test-dir _Build/windows --output-on-failure --no-tests=error `
            --output-log _Build/reports/ctest.log 2>&1 |
            Tee-Object -FilePath _Build/reports/ctest-console.log
          if ($LASTEXITCODE -ne 0) { throw 'CTest failed' }

      - name: Install and validate portable package
        id: package
        shell: pwsh
        run: |
          cmake --install _Build/windows --prefix _Build/windows/install
          if ($LASTEXITCODE -ne 0) { throw 'CMake install failed' }
          ./scripts/package-windows.ps1 `
            -InstallDirectory _Build/windows/install `
            -VcpkgInstallDirectory _Build/vcpkg/installed/x64-windows `
            -SourceDirectory . `
            -OutputDirectory artifacts `
            -Commit "${{ github.sha }}"

      - name: Write verification report
        if: always()
        shell: pwsh
        env:
          SOURCE_RESULT: ${{ steps.patch.outcome }}
          TOOLCHAIN_RESULT: ${{ steps.toolchain.outcome }}
          CONFIGURE_RESULT: ${{ steps.configure.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          CTEST_RESULT: ${{ steps.ctest.outcome }}
          PACKAGE_RESULT: ${{ steps.package.outcome }}
        run: |
          New-Item -ItemType Directory -Path artifacts/reports -Force | Out-Null
          @(
            "Commit: $env:GITHUB_SHA"
            "Runner: windows-2022"
            "Pinned KytyPS5: b3e419ff1101999525fa2d061ada1d102cf788b1"
            "Pinned vcpkg: $env:VCPKG_COMMIT"
            "glslang: $env:GLSLANG_PACKAGE"
            "glslangValidator: $env:GLSLANG_VALIDATOR_VERSION"
            "Source checkout: $env:SOURCE_RESULT"
            "Toolchain verification: $env:TOOLCHAIN_RESULT"
            "CMake configure: $env:CONFIGURE_RESULT"
            "Build: $env:BUILD_RESULT"
            "CTest: $env:CTEST_RESULT"
            "Packaging: $env:PACKAGE_RESULT"
          ) | Set-Content -LiteralPath artifacts/reports/VERIFICATION.txt -Encoding utf8
          if (Test-Path _Build/reports) {
            Copy-Item _Build/reports/* artifacts/reports/ -Force
          }

      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MohammedLab-PS5-Windows-reports
          path: artifacts/reports/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload validated Windows ZIP and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MohammedLab-PS5-Windows-x64
          path: |
            artifacts/MohammedLab-PS5-Windows-x64.zip
            artifacts/MohammedLab-PS5-Windows-x64.zip.sha256
            artifacts/build-manifest.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload matching recursive source and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MohammedLab-PS5-source
          path: |
            artifacts/MohammedLab-PS5-source.zip
            artifacts/MohammedLab-PS5-source.zip.sha256
          if-no-files-found: error
          retention-days: 30
